name: CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  id-token: write # Necesario para OIDC
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::274847733098:role/github-actions-role
          aws-region: us-east-1

      - name: Login en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construir y subir imagen a ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: cultural-api-repo
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  deploy-to-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configurar credenciales AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::274847733098:role/github-actions-role
          aws-region: us-east-1

      - name: Ejecutar despliegue en EC2 via SSM
        env:
          ENV_BASE64: ${{ secrets.ENV_BASE64 }}
        run: |
          # 1. Enviar comando y capturar el CommandId
          COMMAND_ID=$(aws ssm send-command \
            --targets "Key=tag:Name,Values=MapaCultural-Server" \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":[
              "aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 274847733098.dkr.ecr.us-east-1.amazonaws.com",
              "cd /home/ubuntu",
              "echo '"$ENV_BASE64"' | base64 -d > .env",
              "curl -H '\''Cache-Control: no-cache'\'' -s -O https://raw.githubusercontent.com/RamonMartinez01/back-ofertacultural/main/docker-compose.yml",
              "docker pull 274847733098.dkr.ecr.us-east-1.amazonaws.com/cultural-api-repo:latest",
              "docker compose up -d",
              "docker image prune -a -f"
            ]}' \
            --comment "Despliegue automatico via CI/CD" \
            --query "Command.CommandId" \
            --output text)

          echo "🚀 Comando enviado a SSM. Command ID: $COMMAND_ID"
          echo "⏳ Esperando a que el comando termine en la EC2..."

          # 2. Polling (Consultar el estado cada 5 segundos)
          while true; do
            STATUS=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --details \
              --query "CommandInvocations[0].Status" \
              --output text)

            if [ "$STATUS" == "Success" ]; then
              echo "✅ Despliegue exitoso en EC2."
              break
            elif [ "$STATUS" == "Failed" ] || [ "$STATUS" == "TimedOut" ] || [ "$STATUS" == "Cancelled" ]; then
              echo "❌ Error en el despliegue. Estado: $STATUS"
              echo "--- LOGS DEL SERVIDOR ---"
              aws ssm list-command-invocations \
                --command-id "$COMMAND_ID" \
                --details \
                --query "CommandInvocations[0].CommandPlugins[0].Output" \
                --output text
              exit 1
            elif [ "$STATUS" == "None" ] || [ "$STATUS" == "" ]; then
              echo "Buscando invocación..."
            else
              echo "Estado actual: $STATUS. Esperando 5 segundos..."
            fi
            sleep 5
          done