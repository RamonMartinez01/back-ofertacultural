services:

  # ----------------------------------------------
  # 1. Base de Datos (PostGIS)
  # ----------------------------------------------
  db:
    image: postgis/postgis:15-3.3-alpine
    container_name: cultural_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 300M
  # ----------------------------------------------
  # 2. API FastAPI
  # ----------------------------------------------
  api:
    image: 274847733098.dkr.ecr.us-east-1.amazonaws.com/cultural-api-repo:latest
    container_name: cultural_api
    restart: always
    ports:
      - "8010:8000"
    env_file:
      - .env
    depends_on:
      - db

# ----------------------------------------------
# VOLUMEN PERSISTENTE
# ----------------------------------------------
volumes:
  postgres_data:
